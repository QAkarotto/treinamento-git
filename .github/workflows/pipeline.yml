# Nome da pipeline/ workflow
name: pipeline-exemplo

# Gatilho para execução da pipeline
# gatilho manual = workflow_dispatch

on:
    workflow_dispatch:
    
# tarefas/ jobs da pipeline
jobs:
    # nome do job
    testes:
        
        # configuração de máquina onde o job será executado
        runs-on: ubuntu-latest
        
        # passos do job
        steps:
            
            # clone dos arquivos do repositório para a máquina do job
            - uses: actions/checkout@v4
        
            # instalação do node.js
            - uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: Instalação das dependências do projeto
              run: npm install
            
            - name: Execução dos testes unitários
              run: npm test
            

